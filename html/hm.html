<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Form UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;       /* Royal Blue */
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;       /* Light Slate */
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --focus-ring: rgba(37, 99, 235, 0.2);
            --radius: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* --- CONTAINER --- */
        .form-container {
            background: var(--bg-card);
            max-width: 800px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        /* --- HEADER --- */
        .form-header {
            background: var(--primary);
            padding: 2rem;
            color: white;
            text-align: center;
        }
        .form-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .form-header p { opacity: 0.9; font-size: 0.95rem; }

        /* --- FORM BODY --- */
        .form-body {
            padding: 2rem;
        }

        /* --- SECTIONS --- */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--primary); }
        
        .form-section { margin-bottom: 2.5rem; }
        .form-section:last-child { margin-bottom: 0; }

        /* --- INPUT GRID SYSTEM --- */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        /* Full width for specific fields like Address */
        .full-width { grid-column: span 2; }

        /* --- FORM CONTROLS --- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
        }
        
        label span.required { color: #ef4444; margin-left: 2px; }

        input, select, textarea {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
            background-color: #fff;
            color: var(--text-main);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        /* Helper text under inputs */
        .helper-text { font-size: 0.8rem; color: var(--text-muted); }

        /* --- FILE UPLOAD STYLE --- */
        .file-upload-wrapper {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .file-upload-wrapper:hover { border-color: var(--primary); background: #eff6ff; }
        .file-upload-wrapper input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;
        }
        .upload-icon { font-size: 2rem; color: var(--text-muted); margin-bottom: 0.5rem; }

        /* --- BUTTONS --- */
        .form-footer {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            padding: 0.85rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-secondary { background: #e2e8f0; color: var(--text-main); }
        .btn-secondary:hover { background: #cbd5e1; }

        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* --- RESPONSIVE --- */
        @media (max-width: 640px) {
            .input-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            body { padding: 1rem 0.5rem; }
            .form-container { border-radius: 0; box-shadow: none; }
        }
    </style>
</head>
<body>

    <form class="form-container" action="#" method="POST">
        <div class="form-header">
            <h1>Student Registration</h1>
            <p>Please fill in the details below to complete your profile.</p>
        </div>

        <div class="form-body">
            
            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-user"></i> Personal Information
                </div>
                <div class="input-grid">
                    <div class="form-group">
                        <label>First Name <span class="required">*</span></label>
                        <input type="text" placeholder="e.g. Sarah" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name <span class="required">*</span></label>
                        <input type="text" placeholder="e.g. Jenkins" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth <span class="required">*</span></label>
                        <input type="date" required>
                    </div>
                    <div class="form-group">
                        <label>Gender <span class="required">*</span></label>
                        <select required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Email Address <span class="required">*</span></label>
                        <input type="email" placeholder="student@example.com" required>
                        <span class="helper-text">University updates will be sent here.</span>
                    </div>
                    <div class="form-group full-width">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="+1 (555) 000-0000">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-graduation-cap"></i> Academic Details
                </div>
                <div class="input-grid">
                    <div class="form-group">
                        <label>Student ID (if applicable)</label>
                        <input type="text" placeholder="e.g. 2024001">
                    </div>
                    <div class="form-group">
                        <label>Course / Major <span class="required">*</span></label>
                        <select required>
                            <option value="" disabled selected>Select Course</option>
                            <option value="cs">Computer Science</option>
                            <option value="eng">Engineering</option>
                            <option value="bus">Business Admin</option>
                            <option value="arts">Fine Arts</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Enrollment Year</label>
                        <input type="number" min="2020" max="2030" value="2025">
                    </div>
                    <div class="form-group">
                        <label>Previous GPA / Marks</label>
                        <input type="number" step="0.01" placeholder="e.g. 3.8">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-home"></i> Address & Guardian
                </div>
                <div class="input-grid">
                    <div class="form-group full-width">
                        <label>Permanent Address</label>
                        <textarea rows="2" placeholder="Street, City, State, Zip"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Guardian Name</label>
                        <input type="text" placeholder="Parent/Guardian Name">
                    </div>
                    <div class="form-group">
                        <label>Guardian Contact</label>
                        <input type="tel" placeholder="Emergency Phone">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="section-title">
                    <i class="fas fa-cloud-upload-alt"></i> Documents
                </div>
                <div class="input-grid">
                    <div class="form-group full-width">
                        <label>Upload Profile Photo</label>
                        <div class="file-upload-wrapper">
                            <i class="fas fa-image upload-icon"></i>
                            <p><strong>Click to upload</strong> or drag and drop</p>
                            <span class="helper-text">SVG, PNG, JPG (Max 2MB)</span>
                            <input type="file" accept="image/*">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Register Student</button>
            </div>
        </div>
    </form>

</body>
</html>
