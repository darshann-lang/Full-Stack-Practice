<html>
<head>
<title>Form</title>
</head>

<style>
h2{
text-align:center;
background-color:#F29373
}
body{
background-color: #FF8762;
}
button{
background-color:#f72565;
}
</style>

<body>
<h2>Student Details</h2>
<form>

<div class="input-text">
<label for = "fname"> First name: </label> 
<input type="text" id="fname" name="fname"> <br>

<label for = "mname"> Middle name: </label>
<input type="text" id="mname" name="mname"> <br> 

<label for = "lname"> Last name: </label>
<input type="text" id="lname" name="lname"> <br> 

<label for ="contact"> Contact number: </label>
<input type="text" id="contact" name="contact" value="+91 "> <br>

<label for ="email"> Email ID: </label>
<input type="email" id="email" name="email"> <br>
</div>
<br>

<div class="radio-button">
<b>Gender:</b>
<input type = "radio" id = "male" name = "gender" value = "male">
<label for = "male">Male</label>

<input type = "radio" id = "female" name = "gender" value = "female">
<label for = "female">Female</label>
</div>
<br>

<div class="checkbox">
<b>ID Proof:</b>
<input type = "checkbox" id = "adhar" name = "idproof" value = "adhar">
<label for = "adhar">Aadhar Card</label>

<input type = "checkbox" id = "pass" name = "idproof" value = "pass">
<label for = "pass">Passport</label>

<input type = "checkbox" id = "license" name = "idproof" value = "license">
<label for = "license">License</label>

<input type = "checkbox" id = "pan" name = "idproof" value = "pan">
<label for = "pan">Pan Card</label>
</div>
<br>

<label for = "address"> Address: </label>
<textarea name = "address" rows = "5" cols = "30"></textarea> <br> 

<button>Submit</button>


</form>
</body>
<html>
