<!DOCTYPE html>
<html lang="en">
<head>
<title> Rectangle - Area and Perimeter </title>
</head>
<body>
<h4>Area & Perimeter of Rectangle </h4>
<p id="demo"></p>
<script>
let length = 4;
let breadth = 6;
ch = 1;
switch (ch) {
case 1:
rectangle = "Area of rectangle is " + (length * breadth);
break;

case 2:
rectangle = "Perimeter of rectangle is " + (2 * (length + breadth));
}
document.getElementById("demo").innerHTML = rectangle;
</script>
</body>
</html>
